apiVersion: v1
kind: Pod
metadata:
  name: quick-gpu-test
  namespace: arc-runners
spec:
  containers:
  - name: test
    image: ghcr.io/leoxinhaolee/amd-runner:latest
    command: ["/bin/bash", "-c"]
    args:
      - |
        set -e
        echo "=== GPU Quick Test ==="
        echo ""
        echo "1. Checking device files..."
        ls -la /dev/kfd /dev/dri/renderD* 2>&1 | head -5 || echo "Devices not found"
        echo ""
        echo "2. Testing rocminfo..."
        timeout 5 rocminfo --version 2>&1 || echo "rocminfo failed"
        echo ""
        echo "3. Testing amd-smi..."
        timeout 5 amd-smi 2>&1 | head -10 || echo "amd-smi failed"
        echo ""
        echo "4. Testing PyTorch GPU access..."
        python3 -c "import torch; print('PyTorch:', torch.__version__); print('GPU available:', torch.cuda.is_available()); print('GPU count:', torch.cuda.device_count() if torch.cuda.is_available() else 0); x=torch.rand(10,10).cuda() if torch.cuda.is_available() else None; print('GPU op OK') if torch.cuda.is_available() else None; torch.cuda.empty_cache() if torch.cuda.is_available() else None"
        echo ""
        echo "=== Test Complete: SUCCESS ==="
    env:
      - name: HSA_OVERRIDE_GFX_VERSION
        value: "11.0.0"
    securityContext:
      privileged: true
      runAsUser: 0
      runAsGroup: 0
      capabilities:
        add:
          - SYS_ADMIN
          - SYS_RESOURCE
          - SYS_PTRACE
      supplementalGroups:
        - 992
  restartPolicy: Never
  nodeSelector:
    amd.com/gpu.present: "true"

