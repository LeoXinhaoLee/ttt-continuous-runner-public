# LimitRange for GPU resources is NOT needed
# The Kyverno policy (amd-gpu-kyverno-policy.yaml) handles GPU resource injection
# selectively for workflow pods only (pods ending with "-workflow").
#
# NOTE: We previously had default GPU resources set here, but that caused ALL pods
# (including runner pods) to get GPU resources, leading to allocation conflicts.
# By removing default GPU resources from LimitRange and using Kyverno to inject
# resources only into workflow pods, we avoid these conflicts.
#
# If you need LimitRange for other purposes (e.g., memory/CPU limits), you can
# add those here without GPU defaults.

