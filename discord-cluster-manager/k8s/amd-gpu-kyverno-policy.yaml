apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-amd-gpu-resources
  annotations:
    description: "Injects AMD GPU resource requests (1 GPU per pod) and node selector for ARC workflow job containers (matches pods ending with -workflow)"
spec:
  background: false
  rules:
    - name: add-amd-gpu-resources-to-workflow-pods
      match:
        resources:
          kinds:
            - Pod
          namespaces:
            - arc-runners
          names:
            - "*-workflow"
      mutate:
        patchStrategicMerge:
          spec:
            # k3s uses containerd+runc with different LSM defaults than Docker
            # Explicitly disable seccomp and AppArmor for ROCm compatibility
            securityContext:
              seccompProfile:
                type: Unconfined
              runAsUser: 0
              runAsGroup: 0
              supplementalGroups:
                - 992  # render group for AMD GPU access
            # Large /dev/shm for PyTorch/ROCm (default is too small)
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: "8Gi"
            containers:
              - (name): "*"
                resources:
                  requests:
                    amd.com/gpu: "1"
                  limits:
                    amd.com/gpu: "1"
                # Note: HSA_OVERRIDE_GFX_VERSION removed - only set if actually needed
                # Note: ROCR_VISIBLE_DEVICES not needed - device plugin handles GPU allocation
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
                securityContext:
                  privileged: true  # Privileged mode gives access to all devices including /dev/kfd and /dev/dri
                  allowPrivilegeEscalation: true
                  runAsUser: 0  # Run as root to match device file ownership
                  runAsGroup: 0
                  capabilities:
                    add:
                      - SYS_ADMIN
                      - SYS_RESOURCE
                      - SYS_PTRACE
            nodeSelector:
              amd.com/gpu.present: "true"
