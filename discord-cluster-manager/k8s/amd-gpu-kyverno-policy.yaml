apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-amd-gpu-resources
  annotations:
    description: "Injects AMD GPU resource requests (1 GPU per pod) and node selector for ARC workflow job containers (matches pods ending with -workflow)"
spec:
  background: false
  rules:
    - name: add-amd-gpu-resources-to-workflow-pods
      match:
        resources:
          kinds:
            - Pod
          namespaces:
            - arc-runners
          names:
            - "*-workflow"
      mutate:
        patchStrategicMerge:
          spec:
            # Set pod-level privileged mode (better than explicit device mounts for GPU access)
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              supplementalGroups:
                - 992  # render group for AMD GPU access
            containers:
              - (name): "*"
                resources:
                  requests:
                    amd.com/gpu: "1"
                  limits:
                    amd.com/gpu: "1"
                env:
                  - name: HSA_OVERRIDE_GFX_VERSION
                    value: "11.0.0"  # For MI300X (gfx1100). Adjust if using different GPU architecture.
                  # Note: ROCR_VISIBLE_DEVICES should be set by the device plugin based on amd.com/gpu resource allocation
                  # Device plugin will limit visible GPUs to only the allocated ones, even with privileged mode
                securityContext:
                  privileged: true  # Privileged mode gives access to all devices including /dev/kfd and /dev/dri
                  runAsUser: 0  # Run as root to match device file ownership
                  runAsGroup: 0
                  capabilities:
                    add:
                      - SYS_ADMIN
                      - SYS_RESOURCE
                      - SYS_PTRACE
                  supplementalGroups:
                    - 992  # render group for AMD GPU access
            nodeSelector:
              amd.com/gpu.present: "true"
