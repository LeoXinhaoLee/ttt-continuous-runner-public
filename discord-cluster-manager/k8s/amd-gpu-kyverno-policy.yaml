apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-amd-gpu-resources
  annotations:
    description: "Injects AMD GPU resource requests (1 GPU per pod) and node selector for ARC workflow job containers (matches pods ending with -workflow)"
spec:
  background: false
  rules:
    - name: add-amd-gpu-resources-to-workflow-pods
      match:
        resources:
          kinds:
            - Pod
          namespaces:
            - arc-runners
          names:
            - "*-workflow"
      mutate:
        patchStrategicMerge:
          spec:
            containers:
              - (name): "*"
                resources:
                  requests:
                    amd.com/gpu: "1"
                  limits:
                    amd.com/gpu: "1"
                securityContext:
                  capabilities:
                    add:
                      - SYS_ADMIN
                      - SYS_RESOURCE
                      - SYS_PTRACE
            nodeSelector:
              amd.com/gpu.present: "true"
