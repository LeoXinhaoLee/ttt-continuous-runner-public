apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: inject-amd-gpu-resources
  annotations:
    description: "Injects AMD GPU resource requests (1 GPU per pod) and node selector for ARC workflow job containers (matches pods ending with -workflow)"
spec:
  background: false
  rules:
    - name: add-amd-gpu-resources-to-workflow-pods
      match:
        resources:
          kinds:
            - Pod
          namespaces:
            - arc-runners
          names:
            - "*-workflow"
      mutate:
        patchStrategicMerge:
          spec:
            # k3s uses containerd+runc with different LSM defaults than Docker
            # Explicitly disable seccomp for ROCm compatibility (but don't use privileged mode)
            securityContext:
              seccompProfile:
                type: Unconfined
              runAsUser: 0  # Run as root for device file access
              runAsGroup: 0
              supplementalGroups:
                - 992  # render group for AMD GPU access (allows access to /dev/dri/renderD*)
            # Large /dev/shm for PyTorch/ROCm (default is too small)
            volumes:
              - name: dshm
                emptyDir:
                  medium: Memory
                  sizeLimit: "8Gi"
            containers:
              - (name): "*"
                resources:
                  requests:
                    amd.com/gpu: "1"
                  limits:
                    amd.com/gpu: "1"
                # Note: Do NOT set ROCR_VISIBLE_DEVICES - let device plugin handle GPU isolation
                # Device plugin restricts device file access so each pod only sees its allocated GPU
                volumeMounts:
                  - name: dshm
                    mountPath: /dev/shm
                # Non-privileged: device plugin will restrict device file access
                # Keep minimal capabilities and runAsUser for device access
                securityContext:
                  runAsUser: 0  # Root needed for /dev/kfd access
                  runAsGroup: 0
                  capabilities:
                    add:
                      - SYS_ADMIN  # Minimal capability, device plugin still restricts device access
            nodeSelector:
              amd.com/gpu.present: "true"
