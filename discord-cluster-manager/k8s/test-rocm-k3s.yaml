apiVersion: v1
kind: Pod
metadata:
  name: rocm-torch-smoke
  namespace: arc-runners
  annotations:
    container.apparmor.security.beta.kubernetes.io/test: unconfined
spec:
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: Unconfined
    supplementalGroups:
      - 992   # render gid on your node (verify via: getent group render)

  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: "8Gi"

  containers:
    - name: test
      image: ghcr.io/leoxinhaolee/amd-runner:latest
      resources:
        limits:
          amd.com/gpu: "1"
        requests:
          amd.com/gpu: "1"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
      command: ["/bin/bash","-lc"]
      args:
        - |
          set -euo pipefail
          ls -l /dev/kfd || true
          ls -l /dev/dri/renderD* | head -20 || true
          timeout 10 rocminfo --support | head -80
          timeout 30 python3 -c "import torch; print('torch', torch.__version__); print('is_available', torch.cuda.is_available()); x = torch.rand((1024,1024), device='cuda'); y = x @ x; torch.cuda.synchronize(); print('ok', y.mean().item())"
  nodeSelector:
    amd.com/gpu.present: "true"

