apiVersion: v1
kind: Pod
metadata:
  name: gpu-isolation-test-${POD_INDEX}
  namespace: arc-runners
spec:
  restartPolicy: Never
  securityContext:
    seccompProfile:
      type: Unconfined
    runAsUser: 0
    runAsGroup: 0
    supplementalGroups:
      - 992
  volumes:
    - name: dshm
      emptyDir:
        medium: Memory
        sizeLimit: "8Gi"
  containers:
    - name: test
      image: ghcr.io/leoxinhaolee/amd-runner:latest
      command: ["/bin/bash", "-c"]
      args:
        - |
          echo "=== GPU Isolation Test Pod ${POD_INDEX} ==="
          echo "Pod Name: $(hostname)"
          echo ""
          echo "Environment Variables:"
          echo "  ROCR_VISIBLE_DEVICES: ${ROCR_VISIBLE_DEVICES:-not set}"
          echo "  HIP_VISIBLE_DEVICES: ${HIP_VISIBLE_DEVICES:-not set}"
          echo ""
          echo "Device Count (PyTorch):"
          python3 -c "
          import torch
          if torch.cuda.is_available():
              count = torch.cuda.device_count()
              print(f'  torch.cuda.device_count(): {count}')
              if count == 1:
                  print('  ✅ CORRECT: Pod sees exactly 1 GPU (its allocated GPU)')
              else:
                  print(f'  ❌ PROBLEM: Pod sees {count} GPUs (should be 1)')
                  print('     Device plugin is NOT isolating GPUs properly!')
          else:
              print('  ❌ GPU not available')
          "
          echo ""
          echo "Device Files:"
          ls -1 /dev/dri/renderD* 2>/dev/null | wc -l | xargs -I {} echo "  Render devices found: {}"
          echo ""
          sleep 600  # Keep running for 10 minutes for inspection
      resources:
        requests:
          amd.com/gpu: "1"
        limits:
          amd.com/gpu: "1"
      volumeMounts:
        - name: dshm
          mountPath: /dev/shm
      securityContext:
        privileged: true
        allowPrivilegeEscalation: true
        runAsUser: 0
        runAsGroup: 0
        capabilities:
          add:
            - SYS_ADMIN
            - SYS_RESOURCE
            - SYS_PTRACE
  nodeSelector:
    amd.com/gpu.present: "true"

