name: AMD MLA-Decode Eval Job
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Unique identifier for this run'
        required: true
        type: string
      payload:
        description: 'Content of the user submission, as json string'
        required: true
        type: string
      runner:
        description: 'AMD runner to run workflow on'
        required: true
        default: "amd-arc-runner"
        type: string
      requirements:
        description: 'Contents for a requirements.txt file'
        required: false
        type: string

run-name: 'AMD MLA-Decode Job - ${{ github.event.inputs.run_id }}'

# Note: No concurrency group needed - each workflow run is independent (unique run_id)
# ARC maxRunners: 8 will limit concurrent runners and prevent burst behavior
jobs:
  run:
    runs-on: ${{ github.event.inputs.runner }}
    timeout-minutes: 30
    container:
      image: ghcr.io/leoxinhaolee/amd-runner:latest
      options: --user root
      # Note: --privileged removed - GPU isolation handled by Kyverno policy in Kubernetes
    steps:
    - uses: actions/checkout@v3
      with:
        fetch-depth: 1  # Only fetch the latest commit

    - name: Create input files
      shell: bash
      working-directory: discord-cluster-manager
      run: |
        # Extract the payload content without printing it
        PAYLOAD=$(jq -r '.inputs.payload' $GITHUB_EVENT_PATH)

        # Apply mask to the extracted content
        echo "::add-mask::$PAYLOAD"

        # Now write to file (won't be logged since it's masked)
        echo "$PAYLOAD" > payload.json

    - name: Install Package
      shell: bash
      working-directory: discord-cluster-manager
      run: |
        # Install the package itself (needs source code from checkout)
        # All dependencies are already pre-installed in the Docker image, so skip dependency checking
        pip install -e . --no-deps --root-user-action=ignore

    - name: Run eval script
      shell: bash
      working-directory: discord-cluster-manager
      run: |
        python3 src/runners/github-runner.py

    - name: Upload training artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: run-result
        path: discord-cluster-manager/result.json
        retention-days: 1
